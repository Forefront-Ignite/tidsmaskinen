name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # creates the GitHub Release and pushes appcast.xml back to main
  pages: write      # publishes appcast.xml + the zip to GitHub Pages
  id-token: write   # deploy-pages verifies the deployment origin with OIDC

# Serialize releases because each publishes an update to the same appcast branch.
concurrency:
  group: tidsmaskinen-release
  cancel-in-progress: false

jobs:
  build-and-release:
    # deploy-pages runs in this job, so it targets the github-pages environment.
    # That environment must allow deployments from v* tags (its default only
    # allows main): Settings → Environments → github-pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # macOS 26 (Tahoe) runner — required for the macOS 26 SDK that the app's
    # Liquid Glass APIs (glassEffect, .rect, …) build against. macos-15/Xcode 16
    # has no macOS 26 SDK and the build fails to compile.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Build the triggering tag, never whatever main happens to contain.

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          # Pick the newest installed Xcode 26.x; fall back to the default symlink.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Keep the system keychain in the search list so notarytool can still
          # find the App Store Connect API key trust roots.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
              -k "$KEYCHAIN" \
              -P "$CERT_P12_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          VERSION: ${{ github.ref_name }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZE: '1'
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export VERSION="${VERSION#v}"
          ./bin/make-app.sh release

      - name: Sign update for Sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PRIV="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 --decode > "$PRIV"
          chmod 600 "$PRIV"
          SIGN_UPDATE=$(find .build/artifacts -name sign_update -type f -path "*/bin/sign_update" | head -n1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "sign_update tool not found under .build/artifacts" >&2
            exit 1
          fi
          SIG_LINE=$("$SIGN_UPDATE" -f "$PRIV" build/Tidsmaskinen.zip)
          rm -f "$PRIV"
          # Persist for later steps via the multiline env-file format.
          {
            echo "SIG_LINE<<__SIG_EOF__"
            echo "$SIG_LINE"
            echo "__SIG_EOF__"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/Tidsmaskinen.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Install:**

            1. Download `Tidsmaskinen.zip` below and unzip it.
            2. Drag `Tidsmaskinen.app` into the `Applications` folder in your **home** folder (`~/Applications`; create it if it doesn't exist). Don't use the system `/Applications` folder: updates there need admin rights. If an older copy already lives in `/Applications`, just launch it — it offers to move itself.
            3. Launch from the menu bar.

            Future updates are offered inside the app — check the menu bar dropdown.

      - name: Build update feed
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git fetch origin main
          git checkout -B appcast-update origin/main
          ./bin/update-appcast.sh "$VERSION" "$SIG_LINE"
          mkdir -p "_site/releases/v$VERSION"
          cp appcast.xml _site/appcast.xml
          cp build/Tidsmaskinen.zip "_site/releases/v$VERSION/Tidsmaskinen.zip"

      # Installed apps read the feed and download the zip from GitHub Pages,
      # which stays public even when the repository is private. Each deploy
      # replaces the whole site, so it only ever carries the newest zip;
      # Sparkle never downloads anything older than the top item anyway.
      - name: Upload update site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Deploy before the appcast is pushed to main: builds ≤ 0.3.15 read
      # main's copy the moment it lands, and their download would 404 until
      # Pages serves the zip.
      - name: Deploy update site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify update site
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          URL="https://forefront-ignite.github.io/tidsmaskinen/releases/v$VERSION/Tidsmaskinen.zip"
          for attempt in $(seq 1 12); do
            # -L: without it curl exits 0 on a redirect without checking
            # where it lands.
            if curl -fsSLI "$URL" >/dev/null; then
              echo "Update zip reachable at $URL"
              exit 0
            fi
            echo "Not reachable yet (attempt $attempt); waiting" >&2
            sleep 10
          done
          echo "Update zip never became reachable at $URL" >&2
          exit 1

      - name: Publish appcast.xml to main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git config user.name  "tidsmaskinen-release-bot"
          git config user.email "tidsmaskinen-release-bot@users.noreply.github.com"
          # The Pages site and the release asset are already published, so a
          # rejected push here would leave older installs never offered the
          # update. Regenerate on a fresh main and retry if someone pushed in
          # between (only pubDate can differ from the deployed copy).
          for attempt in 1 2 3; do
            git add appcast.xml
            git commit -m "release: appcast for v$VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "appcast push rejected (attempt $attempt); retrying" >&2
            sleep 5
            git fetch origin main
            git checkout -B appcast-update origin/main
            ./bin/update-appcast.sh "$VERSION" "$SIG_LINE"
          done
          echo "Failed to publish appcast.xml after 3 attempts" >&2
          exit 1

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

