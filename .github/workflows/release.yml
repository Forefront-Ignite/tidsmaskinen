name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # creates the GitHub Release and pushes appcast.xml back to main

# Serialize releases because each publishes an update to the same appcast branch.
concurrency:
  group: tidsmaskinen-release
  cancel-in-progress: false

jobs:
  build-and-release:
    # macOS 26 (Tahoe) runner — required for the macOS 26 SDK that the app's
    # Liquid Glass APIs (glassEffect, .rect, …) build against. macos-15/Xcode 16
    # has no macOS 26 SDK and the build fails to compile.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Build the triggering tag, never whatever main happens to contain.

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          # Pick the newest installed Xcode 26.x; fall back to the default symlink.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Keep the system keychain in the search list so notarytool can still
          # find the App Store Connect API key trust roots.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
              -k "$KEYCHAIN" \
              -P "$CERT_P12_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          VERSION: ${{ github.ref_name }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZE: '1'
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export VERSION="${VERSION#v}"
          ./bin/make-app.sh release

      - name: Sign update for Sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PRIV="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 --decode > "$PRIV"
          chmod 600 "$PRIV"
          SIGN_UPDATE=$(find .build/artifacts -name sign_update -type f -path "*/bin/sign_update" | head -n1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "sign_update tool not found under .build/artifacts" >&2
            exit 1
          fi
          SIG_LINE=$("$SIGN_UPDATE" -f "$PRIV" build/Tidsmaskinen.zip)
          rm -f "$PRIV"
          # Persist for later steps via the multiline env-file format.
          {
            echo "SIG_LINE<<__SIG_EOF__"
            echo "$SIG_LINE"
            echo "__SIG_EOF__"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/Tidsmaskinen.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Install:**

            1. Download `Tidsmaskinen.zip` below and unzip it.
            2. Drag `Tidsmaskinen.app` to `/Applications` (replacing any older copy).
            3. Launch from the menu bar.

            Future updates are offered inside the app — check the menu bar dropdown.

      - name: Update appcast.xml on main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git config user.name  "tidsmaskinen-release-bot"
          git config user.email "tidsmaskinen-release-bot@users.noreply.github.com"
          # The release asset is already published, so a rejected push here
          # would leave installed apps never offered the update. Rebuild the
          # appcast on a fresh main and retry if someone pushed in between.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B appcast-update origin/main
            ./bin/update-appcast.sh "$VERSION" "$SIG_LINE"
            git add appcast.xml
            git commit -m "release: appcast for v$VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "appcast push rejected (attempt $attempt); retrying" >&2
            sleep 5
          done
          echo "Failed to publish appcast.xml after 3 attempts" >&2
          exit 1

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
